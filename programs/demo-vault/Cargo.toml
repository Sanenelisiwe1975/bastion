[package]
name = "demo-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Vulnerable demo vault for the Bastion exploit replay"

[lib]
crate-type = ["cdylib", "lib"]
name = "demo_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "bastion-guard/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022"] }
bastion-guard = { path = "../bastion-guard", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
