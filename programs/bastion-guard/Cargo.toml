[package]
name = "bastion-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Bastion onchain firewall for Solana: circuit breaker + outflow rate limits"

[lib]
crate-type = ["cdylib", "lib"]
name = "bastion_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
